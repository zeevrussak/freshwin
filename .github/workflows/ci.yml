name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FreshWin.slnx -c Release

      - name: Test
        run: dotnet test tests/FreshWin.Tests/FreshWin.Tests.csproj -c Release --no-build --logger trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx
          path: '**/*.trx'

  # Manual, self-hosted only: hosted runners can't provide WHPX nesting or
  # Windows-media licensing. Label the runner: Windows, X64/ARM64, freshwin.
  guest-e2e:
    name: Guest E2E (self-hosted, ${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: x64
            runs-on: [self-hosted, Windows, X64, freshwin]
          - arch: arm64
            runs-on: [self-hosted, Windows, ARM64, freshwin]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch QEMU runtime
        shell: pwsh
        run: ./scripts/fetch-qemu.ps1 -Architecture ${{ matrix.arch }}

      - name: Stage pins + build frozen base (cached in work/)
        shell: pwsh
        run: ./scripts/build-base.ps1 -Arch ${{ matrix.arch }}

      - name: Smoke test — built-in installer checks in a single-use guest
        shell: pwsh
        run: |
          # No app MSI here: build a trivial one? For now this job is a
          # placeholder that validates the base build; point it at your app's
          # MSI in your own repo (or add one under examples/).
          Write-Host 'base image built — wire -Msi to your app installer to run the cycle.'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-e2e-${{ matrix.arch }}
          path: artifacts/guest-e2e/**
